# Pruebas en cada PR y despliegue del Lector a ECS Fargate en cada push a main.
# El frontend (frontend/) sigue en Vercel; este workflow no lo toca.
#
# Rol en AWS: github-actions-almia-lector (OIDC, sin llaves de larga vida), definido en
# criskian/almia-infra (envs/prod/lector.tf), con confianza limitada a la rama main.
name: Deploy Lector (ECS)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-lector
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: almia-lector-certificados
  ECS_CLUSTER: almia-cluster
  ECS_SERVICE: almia-lector-certificados
  CONTAINER_NAME: lector

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::050752608083:role/github-actions-almia-lector
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          docker build --platform linux/amd64 -t "$IMAGE" .
          docker push "$IMAGE"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      # La task definition vive en AWS (variables y referencias a Secrets Manager), no en
      # el repo: se parte de la revisión activa y solo se cambia la imagen.
      - name: Current task definition
        run: |
          aws ecs describe-task-definition --task-definition "$ECS_SERVICE" \
            --query taskDefinition > task-definition.json

      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.image.outputs.uri }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
