# Pruebas en cada PR y despliegue del Lector a ECS Fargate en cada push a main.
# El frontend (frontend/) sigue en Vercel; este workflow no lo toca.
#
# Rol en AWS: github-actions-almia-lector (OIDC, sin llaves de larga vida), definido en
# criskian/almia-infra (envs/prod/lector.tf), con confianza limitada a la rama main. Los
# pasos de despliegue viven en la plantilla criskian/almia-infra/.github/workflows/ecs-deploy.yml.
name: Deploy Lector (ECS)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-lector
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  # Construir, publicar y desplegar con la plantilla común de criskian/almia-infra.
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: criskian/almia-infra/.github/workflows/ecs-deploy.yml@main
    with:
      role-arn: arn:aws:iam::050752608083:role/github-actions-almia-lector
      ecr-repository: almia-lector-certificados
      services: '[{"service":"almia-lector-certificados","container":"lector"}]'
      health-url: https://lectorcertificados.almia.com.co/health
